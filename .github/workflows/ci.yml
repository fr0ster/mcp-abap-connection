name: CI

# Every push and every pull request. Until this existed the only workflow was
# Release, which runs on a tag — so nothing ran the gate before a change was
# merged, and six review rounds in a row found defects a machine could have:
# a committed node_modules symlink, examples that could not compile, test
# helpers shipping to consumers, 120KB of compiler bookkeeping in the tarball.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gate:
    # Windows is here for one reason: npm is `npm.cmd` there and Node will not
    # execute a `.cmd` without a shell, which is how a check that inspects the
    # package came to be unable to start on the one platform nobody here runs.
    # The same class of defect this repo already fixed once, in #36.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # a failure on one platform must not hide the other's
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24', '26']

    name: ${{ matrix.os }} · node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # --ignore-scripts on every npm: the Node 22 runner's npm 10 does not read
      # package.json `allowScripts`, and no dependency's install script is
      # needed to lint, build or test.
      - run: npm ci --ignore-scripts

      # Read-only: formatting is fixed by the author, not by CI, so a build that
      # would fail locally fails here too rather than being quietly repaired.
      - run: npm run lint:check

      - run: npm run build

      # test:ci compiles the tests afresh on every run and runs them with
      # node:test: a cached compile once reported 35 green suites for code that
      # did not compile after a dependency bump.
      - run: npm run test:ci

      - run: npm run check:docs

      - run: npm run check:pack

      # Any known advisory of moderate severity or above fails the job, dev
      # dependencies included: they run here and on every developer's machine.
      # Last, so a run that fails here still shows whether the gate passed.
      - run: npm audit --audit-level=moderate
