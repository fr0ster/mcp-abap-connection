name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.1.0, v1.2.3, etc.

permissions:
  contents: write  # Required for creating releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # The tag names the version it publishes. A tag that does not match
      # package.json would publish one version under another's name and notes.
      - name: Check the tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Read-only, as in CI: Biome, then the auth error contract's shape check
      # (rules 4, 5, 6).
      - name: Lint
        run: npm run lint:check

      - name: Build project
        run: npm run build

      # The gate, before anything is packed. This workflow used to go straight
      # from build to `npm pack`, so a tag could publish an artifact that no
      # test, no docs check and no package check had ever seen — and twice it
      # did: test helpers and 120KB of compiler bookkeeping both reached a
      # published .tgz. Nothing here is new: with the lint step above, these
      # are the steps CI runs (lint:check, build, jest --no-cache, check:docs,
      # check:pack), on one platform and Node 22 — a tag must not be a way
      # around the gate.
      - name: Test
        run: npx jest --no-cache

      - name: Check docs
        run: npm run check:docs

      - name: Check what will be published
        run: npm run check:pack

      - name: Create package
        run: npm pack

      - name: Get package filename
        id: package
        run: |
          PACKAGE_FILE=$(ls mcp-abap-adt-connection-*.tgz)
          echo "filename=$PACKAGE_FILE" >> $GITHUB_OUTPUT
          echo "Package created: $PACKAGE_FILE"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # The notes ARE the changelog section for this tag. They used to be a
      # static block plus generate_release_notes, which lists merged pull
      # requests — and most work here lands as commits, so a release could
      # publish notes naming one PR while everything else in it stayed invisible.
      - name: Build release notes from the changelog
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.package.outputs.filename }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
